[platformio]
src_dir = .

[env]
; Applied to every env. Keep pio away from the Python venv and docs.
build_src_filter =
    +<*>
    -<tools/>
    -<docs/>

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.0.0
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ILI9341 @ ^1.6.0
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0
    bblanchon/ArduinoJson @ ^7.0.0
build_flags =
    -D BOARD_ESP32DEV
    ; NimBLE optimizations - disable unused roles to speed up compile
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_MAX_BONDS=1

[env:wemos_d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.0.0
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
build_flags =
    -D BOARD_WEMOS_D1_MINI32

[env:waveshare_c6_lcd_1_47]
; Waveshare ESP32-C6-LCD-1.47 — RISC-V, 172x320 ST7789 onboard.
; LCD pins are fixed by the board: SDA=6, SCK=7, CS=14, DC=15, RST=21, BL=22.
; Official espressif32 platform doesn't yet ship Arduino for C6 — use pioarduino fork.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200
; default partition is 1.25MB app (too small for our binary). min_spiffs gives 1.9MB per OTA slot.
board_build.partitions = min_spiffs.csv
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.0.0
    ESP32Async/AsyncTCP @ ^3.4.0
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
    bblanchon/ArduinoJson @ ^7.0.0
    moononournation/GFX Library for Arduino @ ^1.4.7
    olikraus/U8g2 @ ^2.36.5
; Skip ILI9341/touch/LCD-1602 files — they pull in libs not in this env's lib_deps.
build_src_filter =
    +<*>
    -<tools/>
    -<docs/>
    -<TftUi.cpp>
    -<LineChart.cpp>
    -<NS2009.cpp>
    -<LcdUi1602.cpp>
build_flags =
    -D BOARD_WAVESHARE_C6_LCD_1_47
    ; Route Arduino Serial to the native USB-CDC (otherwise Serial.print goes to UART0 pins).
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; NimBLE: keep broadcaster enabled (required for legacy advertising in 2.x);
    ; we only act as peripheral, so disable observer.
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_MAX_BONDS=1
