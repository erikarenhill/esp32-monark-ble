[project]
name = "monark-dev-bridge"
version = "0.1.0"
description = "macOS BLE bridge: real pedals + HR vs ESP32-under-test, with browser dashboard and JSON feed."
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
monark-dev-bridge = "monark_dev_bridge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monark_dev_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
